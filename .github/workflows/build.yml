name: Build

# Every push is linted and tested, and the recovery is built for every
# device in devices/, each image zipped. A tag starting with v publishes
# those zips as a release, each shown as the phone it is for. Run by hand,
# it can build for one device alone.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the one device to build for; every device when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo 'devices=["marble"]' >> "$GITHUB_OUTPUT"
          elif [ -n "$DEVICE" ]; then
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          else
            echo "devices=$(basename -s .toml devices/*.toml | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          # The zip is named after the phone alone. v0.2.0-rc.4 was made
          # before that, and is the one release that carries the older name
          # too, with the stock build after the codename: a build made then
          # reads no other, and the releases after this one carry only the
          # name the zip has now.
          name="skyward-$version-$DEVICE"
          legacy="$name"
          if [ "$GITHUB_REF_NAME" = "v0.2.0-rc.4" ]; then legacy="skyward-$version-$DEVICE-$STOCK"; fi
          mkdir out
          # A device whose stock recovery lacks libraries its programs need
          # keeps them beside its configuration.
          extra=()
          if [ -d "devices/$DEVICE-extra" ]; then extra=(--extra "devices/$DEVICE-extra"); fi
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt "${extra[@]}" --out "out/$name.img"
          if [ "$legacy" != "$name" ]; then cp "out/$name.img" "out/$legacy.img"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
          LEGACY: ${{ steps.pack.outputs.legacy }}
        run: |
          zip -9 "$NAME.zip" "$NAME.img"
          [ "$LEGACY" = "$NAME" ] || zip -9 "$LEGACY.zip" "$LEGACY.img"
      # The artifact takes the zip's name. The release that carries the
      # older name too hands out two files, and an artifact left unarchived
      # holds one.
      - uses: actions/upload-artifact@v7
        if: ${{ steps.pack.outputs.legacy == steps.pack.outputs.name }}
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ steps.pack.outputs.legacy != steps.pack.outputs.name }}
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is a zip, which the download keeps whole under its
      # name, as it is handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs. A tag builds
      # only this fork's phone, so the release carries the zips that are
      # there; a version that names a pre-release is published as one.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          zips=()
          for config in devices/*.toml; do
            device=$(basename "$config" .toml)
            # Only the name the zip has now; the release made before the
            # change carries the older name beside it from its own build,
            # and every release asks for this one.
            matches=(images/skyward-"$GITHUB_REF_NAME"-"$device".zip)
            [ ${#matches[@]} -gt 0 ] || continue
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            zips+=("${matches[0]}#$model ($device)")
          done
          [ ${#zips[@]} -gt 0 ] || { echo "no images to publish"; exit 1; }
          flags=()
          case "$GITHUB_REF_NAME" in
            *-rc.*|*-alpha.*|*-beta.*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --title "$GITHUB_REF_NAME" --generate-notes "${zips[@]}" images/SHA256SUMS
